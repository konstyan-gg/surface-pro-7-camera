# Surface Pro 7 camera kernel modules (rear OV8865 via IPU4P + v4l2loopback)
# Sources: linux v6.19.8 + patches/kernel/*, sp7-ipu4-camera@aa0043f + patches/ipu4/*,
#          v4l2loopback v0.15.4. See SOURCES in this directory.
PACKAGE_NAME="sp7-camera"
PACKAGE_VERSION="@VERSION@"

MAKE[0]="sh ./dkms-build.sh ${kernelver} ${kernel_source_dir}"
CLEAN="sh ./dkms-build.sh clean"
AUTOINSTALL="yes"

# The patched sources are from the 6.19 series; newer kernels may change APIs.
BUILD_EXCLUSIVE_ARCH="x86_64"

i=0
for m in ov8865 dw9719 ipu-bridge; do
	BUILT_MODULE_NAME[$i]="$m"
	BUILT_MODULE_LOCATION[$i]="kmod/"
	DEST_MODULE_LOCATION[$i]="/updates/dkms"
	i=$((i+1))
done

IPU4="ipu4/linux-6.19.8/drivers/media/pci/intel/ipu4"
for m in intel-ipu4p intel-ipu4p-isys intel-ipu4p-psys intel-ipu4p-isys-csslib; do
	BUILT_MODULE_NAME[$i]="$m"
	BUILT_MODULE_LOCATION[$i]="$IPU4/"
	DEST_MODULE_LOCATION[$i]="/updates/dkms"
	i=$((i+1))
done
BUILT_MODULE_NAME[$i]="intel-ipu4p-psys-csslib"
BUILT_MODULE_LOCATION[$i]="$IPU4/ipu4p-css/lib2600psys/"
DEST_MODULE_LOCATION[$i]="/updates/dkms"
i=$((i+1))

BUILT_MODULE_NAME[$i]="v4l2loopback"
BUILT_MODULE_LOCATION[$i]="v4l2loopback/"
DEST_MODULE_LOCATION[$i]="/updates/dkms"
